{% set version = "6.0.0.12" %}

package:
  name: nvcomp
  version: {{ version }}

{% set cuda_compiler_version = cuda_compiler_version | default("None") %}
source:
  - url: "https://pypi.org/packages/12/4a/c787cbca865c4c916fb7d76ac7fdd2472dc3bd7c9553ea4bc887fd9d188e/nvidia_nvcomp_cu12-{{ version }}-py3-none-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl"  # [linux and x86_64 and (cuda_compiler_version or "").startswith("12")]
    sha256: "9a05eb1c52bfaae108f971af142068ee591e91e10d125d8227b71f2e9deb054c"  # [linux and x86_64 and (cuda_compiler_version or "").startswith("12")]
  - url: "https://pypi.org/packages/a5/65/0e98cd24a3361c2881268f340d419e884179d7c2f20f864bae1210a0bc7d/nvidia_nvcomp_cu12-{{ version }}-py3-none-manylinux_2_26_aarch64.manylinux_2_28_aarch64.whl"  # [linux and aarch64 and (cuda_compiler_version or "").startswith("12") and arm_variant_type == "sbsa"]
    sha256: "91b2cfde54f9404708464a72c80944ef9fd7b3f288353335bbe7f9e469511e97"  # [linux and aarch64 and (cuda_compiler_version or "").startswith("12") and arm_variant_type == "sbsa"]
  - url: "https://pypi.org/packages/83/76/1d474af1c5536ce1875d601f08e1386b4bf2fc1bb5cfa6c451290dece476/nvidia_nvcomp_cu12-{{ version }}-py3-none-win_amd64.whl"  # [win and x86_64 and (cuda_compiler_version or "").startswith("12")]
    sha256: "54e71f1a7fabd28e0fe1eb0b39cee5b68038102c5d73deea896c1d6f9a293841"  # [win and x86_64 and (cuda_compiler_version or "").startswith("12")]

  - url: "https://pypi.org/packages/e4/b5/198ac6e48031b220684f08ea0c29967c86704914c84db80d13b57c61df40/nvidia_nvcomp_cu13-{{ version }}-py3-none-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl"  # [linux and x86_64 and (cuda_compiler_version or "").startswith("13")]
    sha256: "8386ba3ab6c968d001138eda0f66fe7b7a847e7241384a63232b1c2d50a79d74"  # [linux and x86_64 and (cuda_compiler_version or "").startswith("13")]
  - url: "https://pypi.org/packages/b3/3e/c8c482f66250ba05c04162a81bb94e6ac6336909eadb378c63acf568ec02/nvidia_nvcomp_cu13-{{ version }}-py3-none-manylinux_2_26_aarch64.manylinux_2_28_aarch64.whl"  # [linux and aarch64 and (cuda_compiler_version or "").startswith("13") and arm_variant_type == "sbsa"]
    sha256: "2a249d72451afed47a29f05491399bffd1a31df1dc54145d8b1bcbc40d7b6d2c"  # [linux and aarch64 and (cuda_compiler_version or "").startswith("13") and arm_variant_type == "sbsa"]
  - url: "https://pypi.org/packages/e8/f3/a7852a994e743503f09508d1e31bde4805a579764926a1a208d6232e5c73/nvidia_nvcomp_cu13-{{ version }}-py3-none-win_amd64.whl"  # [win and x86_64 and (cuda_compiler_version or "").startswith("13")]
    sha256: "d37d4a3873f664faa955e0c27afeacbf3b2955ef8bfc5cb29d52fe08fc8e0b6c"  # [win and x86_64 and (cuda_compiler_version or "").startswith("13")]

  # Include cudart license because it is statically linked.
  - url: https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/LICENSE.txt
    fn: cudart_LICENSE.txt
    sha256: e2c71babfd18a8e69542dd7e9ca018f9caa438094001a58e6bc4d8c999bf0d07

build:
  number: 0
  # Anaconda: every wheel's METADATA declares "Requires-Python: >=3.9, <3.15" (also
  # exposed as info.requires_python on PyPI), so skip both ends of that range.
  # Anaconda: NVIDIA publishes only a py3-none-win_amd64 wheel for Windows, so the
  # Python bindings cannot be built for win-arm64 (no win_arm64 wheel on PyPI as of
  # Nov 2026). PBP auto graph generation and submission fails otherwise.
  skip: true  # [osx or (win and not x86_64) or py<39 or py>=315]
  ignore_run_exports:
    - cuda-version

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cuda') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cf-nvidia-tools 1.*  # [linux]
  host:
    - cuda-version {{ cuda_compiler_version }}
    - libnvcomp-dev {{ version.split('.')[:3] | join('.') }}.*
    - pip
    - python
  run:
    - python
    - {{ pin_compatible('cuda-version', min_pin='x', max_pin='x') }}
    # The wheel's METADATA pins "nvidia-libnvcomp-cu<major>=={{ version }}", so pin the
    # equivalent conda runtime package exactly; libnvcomp-dev's run_exports alone only
    # gives ">=6.0.0.12,<7".
    - libnvcomp =={{ version }}

test:
  imports:
    - nvidia.nvcomp
    - nvidia.nvcomp.external_memory
  commands:
    # Cannot add 'pip check' due to the way we manage the dependencies:
    #  * We don't have 'nvidia-libnvcomp-cu<CUDA_VERSION>' package from PyPI.org.
    #  * Instead, we use 'libnvcomp-dev' package from 'libnvcomp' feedstock.
    # nvcomp.__version__ is the nvCOMP library version (major.minor.patch), not the
    # four-component PyPI/conda package version (e.g. "6.0.0" vs "6.0.0.12").
    - python -c "from nvidia import nvcomp; print(\"nvcomp version:\", nvcomp.__version__); assert nvcomp.__version__ == \"{{ version.split('.')[:3] | join('.') }}\""
    # __cuda_version__ is CUDART_VERSION as an int (e.g. 13030 for CUDA 13.3).
    - python -c "from nvidia import nvcomp; print(\"nvcomp cuda version:\", nvcomp.__cuda_version__); assert nvcomp.__cuda_version__ // 1000 == {{ cuda_compiler_version.split('.')[0] }}"
    # build.sh/bld.bat keep only the extension built for the running interpreter.
    - python -c "import glob, importlib.machinery, os; import nvidia.nvcomp as nvcomp; d = os.path.dirname(nvcomp.__file__); mods = glob.glob(os.path.join(d, \"nvcomp_impl*\")); assert len(mods) == 1, mods; assert any(mods[0].endswith(s) for s in importlib.machinery.EXTENSION_SUFFIXES), (mods, importlib.machinery.EXTENSION_SUFFIXES)"
    # The C library must come from the libnvcomp package, not be bundled in the wheel.
    - python -c "import glob, os; import nvidia.nvcomp as nvcomp; d = os.path.dirname(nvcomp.__file__); assert not glob.glob(os.path.join(d, \"libnvcomp.so*\")); assert not glob.glob(os.path.join(d, \"nvcomp*.dll\")); assert not os.path.isdir(os.path.join(d, \"include\"))"

about:
  home: https://developer.nvidia.com/nvcomp
  license: LicenseRef-nvCOMP-Software-License-Agreement AND LicenseRef-NVIDIA-End-User-License-Agreement
  license_file:
    - LICENSE
    # Third-party licenses (zstd, Meta ANS, ...) bundled into the nvcomp binaries.
    - NOTICE
    - cudart_LICENSE.txt
  license_url: https://developer.download.nvidia.com/compute/nvcomp/2.3/LICENSE.txt
  summary: "The nvCOMP Python bindings. Developers should install libnvcomp-dev for C-APIs."
  description: |
    The nvCOMP library provides fast lossless data compression and
    decompression using a GPU. It features generic compression interfaces to
    enable developers to use high-performance GPU compressors in their
    applications.

    License Agreements:- The packages are governed by the standard NVIDIA
    Software License Agreement (EULA). By downloading and using the packages,
    you accept the terms and conditions of the NVIDIA nvCOMP EULA -
    https://developer.download.nvidia.com/compute/nvcomp/2.3/LICENSE.txt
  doc_url: https://docs.nvidia.com/cuda/nvcomp/index.html
  dev_url: https://developer.nvidia.com/nvcomp

extra:
  skip-lints:
    - license_file_overspecified
  feedstock-name: nvcomp
  recipe-maintainers:
    - gmrrk
    - baliika
    - conda-forge/cuda
